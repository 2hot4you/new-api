name: molii-new-api-dev

services:
  postgres:
    image: postgres:15-alpine
    container_name: molii-new-api-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: new_api
      POSTGRES_USER: new_api
      POSTGRES_PASSWORD: new_api_local
    ports:
      - "127.0.0.1:${MOLII_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: molii-new-api-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${MOLII_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    name: molii-new-api-dev-postgres-data
  redis_data:
    name: molii-new-api-dev-redis-data
