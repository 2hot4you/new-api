<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= siteBrand.faviconFallback %>"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= siteBrand.appleTouchIcon %>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title><%= siteBrand.title %></title>
    <meta name="title" content="<%= siteBrand.title %>" />
    <meta name="description" content="<%= siteBrand.description %>" />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
