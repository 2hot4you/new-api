<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="<%= siteBrand.favicon %>"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="<%= siteBrand.appleTouchIcon %>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title><%= siteBrand.title %></title>
    <meta name="title" content="<%= siteBrand.title %>" />
    <meta
      name="description"
      content="<%= siteBrand.description %>"
    />

    <meta name="theme-color" content="#fff" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
