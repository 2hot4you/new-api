name: Build and deploy Molii documentation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve documentation target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      deploy_dir: ${{ steps.target.outputs.deploy_dir }}
      site_origin: ${{ steps.target.outputs.site_origin }}
      api_base_url: ${{ steps.target.outputs.api_base_url }}
      docs_url: ${{ steps.target.outputs.docs_url }}
    steps:
      - name: Map branch to environment
        id: target
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            main)
              echo 'environment=production' >> "$GITHUB_OUTPUT"
              echo 'deploy_dir=/opt/molii/production' >> "$GITHUB_OUTPUT"
              echo 'site_origin=https://molii.co' >> "$GITHUB_OUTPUT"
              echo 'api_base_url=https://molii.co' >> "$GITHUB_OUTPUT"
              echo 'docs_url=https://molii.co/docs/quick-start' >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo 'environment=development' >> "$GITHUB_OUTPUT"
              echo 'deploy_dir=/opt/molii/development' >> "$GITHUB_OUTPUT"
              echo 'site_origin=https://dev.molii.co' >> "$GITHUB_OUTPUT"
              echo 'api_base_url=https://dev.molii.co' >> "$GITHUB_OUTPUT"
              echo 'docs_url=https://dev.molii.co/docs/quick-start' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported documentation branch: $BRANCH_NAME"
              exit 1
              ;;
          esac

  verify-and-build:
    name: Verify and build documentation
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCS_ENV: ${{ needs.prepare.outputs.environment }}
      DOCS_SITE_URL: ${{ needs.prepare.outputs.site_origin }}
      DOCS_BASE_URL: /docs/
      DOCS_API_BASE_URL: ${{ needs.prepare.outputs.api_base_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install documentation dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Run non-browser documentation tests
        working-directory: docs-site
        run: |
          test_files=$(find scripts -maxdepth 1 -name '*.test.ts' ! -name '*.browser.test.ts' -print | sort)
          bun test $test_files

      - name: Run browser documentation tests
        working-directory: docs-site
        env:
          DOCS_ENV: development
          DOCS_SITE_URL: http://127.0.0.1:3197
          DOCS_BASE_URL: /
          DOCS_API_BASE_URL: http://127.0.0.1:3000
        run: bun test scripts/api-reference.browser.test.ts

      - name: Check public content
        working-directory: docs-site
        run: |
          bun run check:forbidden
          bun run check:secrets

      - name: Check public API and model catalog
        working-directory: docs-site
        run: |
          bun run api:lint
          bun run catalog:check

      - name: Build the /docs/ static site
        working-directory: docs-site
        run: bun run build

      - name: Crawl internal /docs/ links
        working-directory: docs-site
        run: bun run check:links

      - name: Package static files
        working-directory: docs-site
        run: tar -C build -czf ../molii-docs.tar.gz .

      - name: Upload documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: molii-docs-${{ github.sha }}
          path: molii-docs.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy documentation to ${{ needs.prepare.outputs.environment }}
    needs:
      - prepare
      - verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ needs.prepare.outputs.docs_url }}
    concurrency:
      group: docs-deploy-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_DIR: ${{ needs.prepare.outputs.deploy_dir }}
      DEPLOY_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      SITE_ORIGIN: ${{ needs.prepare.outputs.site_origin }}
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check out deployment script
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download documentation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: molii-docs-${{ github.sha }}
          path: .docs-artifact

      - name: Resolve artifact identity
        id: artifact
        run: |
          archive='.docs-artifact/molii-docs.tar.gz'
          remote_archive="$DEPLOY_DIR/molii-docs-${GITHUB_SHA}.tar.gz"
          test -f "$archive"
          printf 'sha256=%s\n' "$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'remote_path=%s\n' "$remote_archive" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          for value_name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!value_name}" ]; then
              echo "::error::Required secret is empty: $value_name"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload documentation release
        env:
          REMOTE_ARCHIVE: ${{ steps.artifact.outputs.remote_path }}
        run: |
          scp -P "$SSH_PORT" docs-site/deploy/deploy.sh \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/docs-deploy.sh"
          scp -P "$SSH_PORT" .docs-artifact/molii-docs.tar.gz \
            "$SSH_USER@$SSH_HOST:$REMOTE_ARCHIVE"

      - name: Publish documentation release
        env:
          ARCHIVE_SHA256: ${{ steps.artifact.outputs.sha256 }}
          REMOTE_ARCHIVE: ${{ steps.artifact.outputs.remote_path }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "chmod 700 '$DEPLOY_DIR/docs-deploy.sh' && '$DEPLOY_DIR/docs-deploy.sh' '$DEPLOY_ENVIRONMENT' '$GITHUB_SHA' '$REMOTE_ARCHIVE' '$ARCHIVE_SHA256' '$SITE_ORIGIN'"

  notify:
    name: Notify Telegram about documentation
    if: ${{ always() }}
    needs:
      - prepare
      - verify-and-build
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
    steps:
      - name: Send documentation deployment result
        continue-on-error: true
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo 'Telegram secrets are not configured; skipping notification.'
            exit 0
          fi

          case "$DEPLOY_RESULT" in
            success) icon='✅'; status='成功' ;;
            cancelled) icon='⚪'; status='取消' ;;
            *) icon='❌'; status='失败' ;;
          esac

          message="$icon Molii 文档部署$status
          环境: ${TARGET_ENVIRONMENT:-unknown}
          分支: $GITHUB_REF_NAME
          提交: ${GITHUB_SHA:0:12}
          操作者: $GITHUB_ACTOR
          详情: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          curl --silent --show-error --fail \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message"
