name: Build and deploy documentation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve documentation targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.target.outputs.targets }}
    steps:
      - name: Map branch to target matrix
        id: target
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            main)
              echo 'targets=[{"id":"production-molii","environment":"production-molii"},{"id":"production-ixiaozu","environment":"production-ixiaozu"}]' >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo 'targets=[{"id":"development","environment":"development"}]' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported documentation branch: $BRANCH_NAME"
              exit 1
              ;;
          esac

  verify:
    name: Verify documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install documentation dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Run non-browser documentation tests
        working-directory: docs-site
        run: |
          test_files=()
          while IFS= read -r test_file; do
            test_files+=("$test_file")
          done < <(find scripts -maxdepth 1 -name '*.test.ts' ! -name '*.browser.test.ts' -print | sort)
          bun test "${test_files[@]}"

      - name: Run browser documentation tests
        working-directory: docs-site
        env:
          DOCS_ENV: development
          DOCS_SITE_URL: http://127.0.0.1:3197
          DOCS_BASE_URL: /
          DOCS_API_BASE_URL: http://127.0.0.1:3000
        run: bun test scripts/api-reference.browser.test.ts

      - name: Check public content
        working-directory: docs-site
        run: |
          bun run check:forbidden
          bun run check:secrets

      - name: Check public API and model catalog
        working-directory: docs-site
        run: |
          bun run api:lint
          bun run catalog:check

      - name: Test documentation deployment contracts
        run: bash docs-site/deploy/deploy_test.sh

  release:
    name: Release documentation to ${{ matrix.target.id }}
    needs:
      - prepare
      - verify
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ matrix.target.environment }}
      url: ${{ vars.DOCS_SITE_URL }}
    concurrency:
      group: docs-deploy-${{ matrix.target.id }}
      cancel-in-progress: false
    env:
      TARGET_ID: ${{ matrix.target.id }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      DOCS_ENV: ${{ vars.DOCS_ENV }}
      DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}
      DOCS_BASE_URL: /docs/
      DOCS_API_BASE_URL: ${{ vars.DOCS_API_BASE_URL }}
      DOCS_BRAND_ID: ${{ vars.DOCS_BRAND_ID }}
      DOCS_SITE_TITLE: ${{ vars.DOCS_SITE_TITLE }}
      DOCS_TAGLINE: ${{ vars.DOCS_TAGLINE }}
      DOCS_NAVBAR_TITLE: ${{ vars.DOCS_NAVBAR_TITLE }}
      DOCS_LOGO_PATH: ${{ vars.DOCS_LOGO_PATH }}
      DOCS_FAVICON_PATH: ${{ vars.DOCS_FAVICON_PATH }}
      DOCS_SOCIAL_IMAGE_PATH: ${{ vars.DOCS_SOCIAL_IMAGE_PATH }}
      DOCS_DEFAULT_FONT: ${{ vars.DOCS_DEFAULT_FONT }}
      DOCS_LOGO_SOURCE_URL: ${{ vars.DOCS_LOGO_SOURCE_URL }}
      DOCS_FAVICON_SOURCE_URL: ${{ vars.DOCS_FAVICON_SOURCE_URL }}
      DOCS_SOCIAL_IMAGE_SOURCE_URL: ${{ vars.DOCS_SOCIAL_IMAGE_SOURCE_URL }}
      DOCS_ALGOLIA_APP_ID: ${{ matrix.target.id == 'development' && secrets.DOCS_ALGOLIA_APP_ID || '' }}
      DOCS_ALGOLIA_SEARCH_API_KEY: ${{ matrix.target.id == 'development' && secrets.DOCS_ALGOLIA_SEARCH_API_KEY || '' }}
      DOCS_ALGOLIA_INDEX_NAME: ${{ matrix.target.id == 'development' && secrets.DOCS_ALGOLIA_INDEX_NAME || '' }}
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      SITE_MARKER: ${{ vars.DOCS_SITE_TITLE }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.12.0'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install documentation dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Validate selected documentation environment
        run: |
          for value_name in TARGET_ID DEPLOY_DIR DOCS_ENV DOCS_SITE_URL DOCS_API_BASE_URL DOCS_BRAND_ID DOCS_SITE_TITLE DOCS_TAGLINE DOCS_LOGO_PATH DOCS_FAVICON_PATH DOCS_SOCIAL_IMAGE_PATH DOCS_DEFAULT_FONT DOCS_LOGO_SOURCE_URL DOCS_FAVICON_SOURCE_URL DOCS_SOCIAL_IMAGE_SOURCE_URL SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SITE_MARKER; do
            if [[ -z "${!value_name}" ]]; then
              echo "::error::Required GitHub Environment value is empty: $value_name"
              exit 1
            fi
          done

          case "$TARGET_ID" in
            development)
              expected_brand='molii'
              expected_deploy_dir='/opt/molii/development'
              expected_docs_env='development'
              expected_site_url='https://dev.molii.co'
              ;;
            production-molii)
              expected_brand='molii'
              expected_deploy_dir='/opt/molii/production'
              expected_docs_env='production'
              expected_site_url='https://molii.co'
              ;;
            production-ixiaozu)
              expected_brand='ixiaozu'
              expected_deploy_dir='/opt/ixiaozu/production'
              expected_docs_env='production'
              expected_site_url='https://aigc.ixiaozu.cn'
              ;;
            *)
              echo "::error::Unsupported documentation target: $TARGET_ID"
              exit 1
              ;;
          esac
          if [[ "$DOCS_BRAND_ID" != "$expected_brand" ]]; then
            echo "::error::DOCS_BRAND_ID must be $expected_brand for $TARGET_ID"
            exit 1
          fi
          if [[ "$DEPLOY_DIR" != "$expected_deploy_dir" ]]; then
            echo "::error::DEPLOY_DIR must be $expected_deploy_dir for $TARGET_ID"
            exit 1
          fi
          if [[ "$DOCS_ENV" != "$expected_docs_env" ]]; then
            echo "::error::DOCS_ENV must be $expected_docs_env for $TARGET_ID"
            exit 1
          fi
          if [[ "$DOCS_SITE_URL" != "$expected_site_url" || "$DOCS_API_BASE_URL" != "$expected_site_url" ]]; then
            echo "::error::Documentation and API origins must both be $expected_site_url for $TARGET_ID"
            exit 1
          fi

      - name: Prepare selected brand assets
        working-directory: docs-site
        run: bun run brand:prepare

      - name: Build the selected /docs/ site
        working-directory: docs-site
        run: bun run build

      - name: Crawl internal /docs/ links
        working-directory: docs-site
        run: bun run check:links

      - name: Package static files
        working-directory: docs-site
        run: tar -C build -czf "../docs-${TARGET_ID}-${GITHUB_SHA}.tar.gz" .

      - name: Upload branded documentation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-${{ matrix.target.id }}-${{ github.sha }}
          path: docs-${{ matrix.target.id }}-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Resolve artifact identity
        id: artifact
        run: |
          archive="docs-${TARGET_ID}-${GITHUB_SHA}.tar.gz"
          remote_archive="$DEPLOY_DIR/docs-${TARGET_ID}-${GITHUB_SHA}.tar.gz"
          test -f "$archive"
          printf 'sha256=%s\n' "$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          printf 'remote_path=%s\n' "$remote_archive" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload documentation release
        env:
          REMOTE_ARCHIVE: ${{ steps.artifact.outputs.remote_path }}
        run: |
          scp -P "$SSH_PORT" docs-site/deploy/deploy.sh \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/docs-deploy.sh"
          scp -P "$SSH_PORT" "docs-${TARGET_ID}-${GITHUB_SHA}.tar.gz" \
            "$SSH_USER@$SSH_HOST:$REMOTE_ARCHIVE"

      - name: Publish documentation release
        env:
          ARCHIVE_SHA256: ${{ steps.artifact.outputs.sha256 }}
          REMOTE_ARCHIVE: ${{ steps.artifact.outputs.remote_path }}
        run: |
          printf -v deploy_command 'chmod 700 %q && %q %q %q %q %q %q %q' \
            "$DEPLOY_DIR/docs-deploy.sh" \
            "$DEPLOY_DIR/docs-deploy.sh" \
            "$TARGET_ID" \
            "$GITHUB_SHA" \
            "$REMOTE_ARCHIVE" \
            "$ARCHIVE_SHA256" \
            "$DOCS_SITE_URL" \
            "$SITE_MARKER"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$deploy_command"

      - name: Record target result
        if: ${{ always() }}
        env:
          TARGET_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(f"docs-result-{os.environ['TARGET_ID']}.json", "w", encoding="utf-8") as result_file:
              json.dump(
                  {
                      "id": os.environ["TARGET_ID"],
                      "site": os.environ.get("DOCS_SITE_URL", ""),
                      "result": os.environ["TARGET_RESULT"],
                  },
                  result_file,
              )
          PY

      - name: Upload target result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-result-${{ matrix.target.id }}-${{ github.sha }}
          path: docs-result-${{ matrix.target.id }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Notify Telegram
        if: ${{ always() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_RESULT: ${{ job.status }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo 'Telegram secrets are not configured; skipping notification.'
            exit 0
          fi

          case "$DEPLOY_RESULT" in
            success) icon='✅'; status='成功' ;;
            cancelled) icon='⚪'; status='取消' ;;
            *) icon='❌'; status='失败' ;;
          esac

          message="$icon 文档部署$status
          站点: $TARGET_ID ($DOCS_SITE_URL)
          分支: $GITHUB_REF_NAME
          提交: ${GITHUB_SHA:0:12}
          操作者: $GITHUB_ACTOR
          详情: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          curl --silent --show-error --fail \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message"

  summary:
    name: Summarize documentation releases
    if: ${{ always() }}
    needs:
      - prepare
      - verify
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download target results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: docs-result-*-${{ github.sha }}
          path: documentation-results
          merge-multiple: true

      - name: Write release summary
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os

          expected = 2 if os.environ["BRANCH_NAME"] == "main" else 1
          records = []
          for path in glob.glob("documentation-results/*.json"):
              with open(path, encoding="utf-8") as result_file:
                  records.append(json.load(result_file))

          results = [record.get("result", "failure") for record in records]
          if len(records) == expected and all(result == "success" for result in results):
              overall = "success"
          elif any(result == "success" for result in results):
              overall = "partial_success"
          elif any(result == "cancelled" for result in results):
              overall = "cancelled"
          else:
              overall = "failure"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Documentation deployment summary\n\n")
              summary.write(f"- Overall: `{overall}`\n")
              summary.write(f"- Verification: `{os.environ['VERIFY_RESULT']}`\n")
              summary.write(f"- Result records: `{len(records)}/{expected}`\n")
              for record in sorted(records, key=lambda item: item.get("id", "")):
                  summary.write(
                      f"- {record.get('id', 'unknown')} ({record.get('site', '')}): "
                      f"`{record.get('result', 'failure')}`\n"
                  )
          PY
