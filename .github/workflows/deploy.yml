name: Build and deploy application

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
      - '.ccg/tasks/**'
      - 'docs/superpowers/**'
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target (all-production includes molii + ixiaozu + both Claudeye sites)'
        required: true
        default: development
        type: choice
        options:
          - development
          - production-molii
          - production-ixiaozu
          - production-claudeye
          - production-model-claudeye
          - all-production
      source_ref:
        description: Optional branch, tag, or commit for development acceptance
        required: false
        default: ''
        type: string
      backup_postgres:
        description: Create and verify a development PostgreSQL backup before deployment
        required: false
        default: false
        type: boolean
      verify_repeated_startup:
        description: Restart the deployed development container and verify it becomes healthy again
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve deployment targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.target.outputs.targets }}
      source_sha: ${{ steps.target.outputs.source_sha }}
    steps:
      - name: Check out workflow source for trusted target resolution
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve allowed targets and immutable source
        id: target
        env:
          DEPLOY_TARGET: ${{ inputs.target }}
          SOURCE_REF: ${{ inputs.source_ref }}
          BACKUP_POSTGRES: ${{ inputs.backup_postgres }}
          VERIFY_REPEATED_STARTUP: ${{ inputs.verify_repeated_startup }}
        run: python3 deploy/resolve-targets.py

  verify:
    needs: prepare
    name: Verify backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOWORK: 'off'
      TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/new_api_ci?sslmode=disable
      FULL_MIGRATION_POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/new_api_full_migration?sslmode=disable
      MARKETPLACE_ORDER_POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/new_api_marketplace_order?sslmode=disable
      MODEL_MARKETPLACE_POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/new_api_model_marketplace?sslmode=disable
      MODEL_BILLING_CURRENCY_POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/new_api_model_billing_currency?sslmode=disable
      REDEMPTION_POSTGRES_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/new_api_redemption_batch?sslmode=disable
      TEST_REDIS_DSN: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: new_api_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d new_api_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test site brand profiles
        run: bun test web/build/site-brand.test.ts

      - name: Check frontend types
        working-directory: web
        run: bun run typecheck

      - name: Build Molii verification frontend
        working-directory: web
        env:
          VITE_SITE_PROFILE: molii
        run: bun run build

      - name: Create isolated PostgreSQL test databases
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --username postgres --dbname new_api_ci --set ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE new_api_full_migration;
          CREATE DATABASE new_api_marketplace_order;
          CREATE DATABASE new_api_model_marketplace;
          CREATE DATABASE new_api_model_billing_currency;
          CREATE DATABASE new_api_redemption_batch;
          SQL

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

      - name: Run request lifecycle Race Detector
        run: go test -race ./common ./middleware ./service ./controller ./relay ./router -count=1

      - name: Test deployment contracts
        run: |
          python3 -m unittest discover -s deploy/tests -p 'test_*.py'
          bash deploy/tests/deploy_test.sh

  release:
    name: Release ${{ matrix.target.id }}
    concurrency:
      group: release-${{ matrix.target.id }}
      cancel-in-progress: false
    needs:
      - prepare
      - verify
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ matrix.target.environment }}
      url: ${{ vars.DEPLOY_HEALTH_URL }}
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
      DEPLOY_ENVIRONMENT: ${{ matrix.target.id }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
      SITE_DOMAIN: ${{ vars.DEPLOY_SITE_DOMAIN }}
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ github.token }}
      GHCR_USERNAME: ${{ github.actor }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Validate selected environment
        env:
          EXPECTED_PROFILE: ${{ matrix.target.brand_profile }}
          VITE_SITE_PROFILE: ${{ vars.VITE_SITE_PROFILE }}
          VITE_SITE_TITLE: ${{ vars.VITE_SITE_TITLE }}
          VITE_SITE_DESCRIPTION: ${{ vars.VITE_SITE_DESCRIPTION }}
          VITE_SITE_LOGO: ${{ vars.VITE_SITE_LOGO }}
          VITE_SITE_FAVICON: ${{ vars.VITE_SITE_FAVICON }}
          VITE_SITE_APPLE_TOUCH_ICON: ${{ vars.VITE_SITE_APPLE_TOUCH_ICON }}
          VITE_SITE_BANNER_BRAND: ${{ vars.VITE_SITE_BANNER_BRAND }}
          VITE_SITE_DEFAULT_FONT: ${{ vars.VITE_SITE_DEFAULT_FONT }}
        run: |
          for value_name in DEPLOY_DIR HEALTH_URL SITE_DOMAIN SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS VITE_SITE_PROFILE VITE_SITE_TITLE VITE_SITE_DESCRIPTION VITE_SITE_LOGO VITE_SITE_FAVICON VITE_SITE_APPLE_TOUCH_ICON VITE_SITE_BANNER_BRAND VITE_SITE_DEFAULT_FONT; do
            if [[ -z "${!value_name}" ]]; then
              echo "::error::Required GitHub Environment value is empty: $value_name"
              exit 1
            fi
          done
          # These values become remote command arguments; reject shell metacharacters.
          [[ "$DEPLOY_DIR" =~ ^/[a-zA-Z0-9_/-]+$ ]] || { echo '::error::Unsafe deployment directory'; exit 1; }
          [[ "$HEALTH_URL" =~ ^https?://[a-zA-Z0-9./:_-]+$ ]] || { echo '::error::Unsafe health URL'; exit 1; }
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo '::error::Invalid SSH host'; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]] || { echo '::error::Invalid SSH user'; exit 1; }
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SSH_PORT > 0 && 10#$SSH_PORT <= 65535 )) || { echo '::error::Invalid SSH port'; exit 1; }
          if [[ "$VITE_SITE_PROFILE" != "$EXPECTED_PROFILE" ]]; then
            echo "::error::VITE_SITE_PROFILE must be $EXPECTED_PROFILE for $DEPLOY_ENVIRONMENT"
            exit 1
          fi

      - name: Resolve application version
        id: app_version
        env:
          IMAGE_TAG: ${{ matrix.target.image_tag }}
        run: |
          GIT_SHA=$(git rev-parse HEAD)
          [[ "$GIT_SHA" == "$SOURCE_SHA" ]] || exit 1
          printf 'sha=%s\n' "$GIT_SHA" >> "$GITHUB_OUTPUT"
          printf 'value=%s\n' "$(bash deploy/app-version.sh "$IMAGE_TAG" "$GIT_SHA")" >> "$GITHUB_OUTPUT"

      - name: Write image version
        env:
          IMAGE_VERSION: ${{ steps.app_version.outputs.value }}
        run: printf '%s\n' "$IMAGE_VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        run: |
          bash deploy/retry.sh 'runner GHCR login' \
            bash -c 'printf "%s" "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin'

      - name: Build and push target image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.target.image_tag }}
            ${{ env.REGISTRY_IMAGE }}:${{ matrix.target.image_tag }}-${{ steps.app_version.outputs.sha }}
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.value }}
            VCS_REF=${{ steps.app_version.outputs.sha }}
            VITE_SITE_PROFILE=${{ vars.VITE_SITE_PROFILE }}
            VITE_SITE_TITLE=${{ vars.VITE_SITE_TITLE }}
            VITE_SITE_DESCRIPTION=${{ vars.VITE_SITE_DESCRIPTION }}
            VITE_SITE_LOGO=${{ vars.VITE_SITE_LOGO }}
            VITE_SITE_FAVICON=${{ vars.VITE_SITE_FAVICON }}
            VITE_SITE_APPLE_TOUCH_ICON=${{ vars.VITE_SITE_APPLE_TOUCH_ICON }}
            VITE_SITE_BANNER_BRAND=${{ vars.VITE_SITE_BANNER_BRAND }}
            VITE_SITE_DEFAULT_FONT=${{ vars.VITE_SITE_DEFAULT_FONT }}
          cache-from: type=gha,scope=${{ matrix.target.image_tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.image_tag }}
          provenance: mode=max
          sbom: true

      - name: Configure SSH
        run: |
          umask 077
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH connectivity
        run: |
          bash deploy/retry.sh 'SSH connectivity' \
            ssh -p "$SSH_PORT" \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=3 \
              "$SSH_USER@$SSH_HOST" true

      - name: Authenticate server to GHCR
        run: |
          bash deploy/retry.sh 'server GHCR login' \
            bash -c 'printf "%s" "$GHCR_TOKEN" | ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 "$SSH_USER@$SSH_HOST" docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin'

      - name: Upload development backup helper
        if: inputs.backup_postgres && matrix.target.id == 'development'
        run: |
          bash deploy/retry.sh 'development backup helper upload' \
            scp -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 deploy/backup-postgres.sh \
              "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/backup-postgres.sh"

      - name: Back up development PostgreSQL
        if: inputs.backup_postgres && matrix.target.id == 'development'
        env:
          BACKUP_NAME: new-api-before-${{ steps.app_version.outputs.sha }}.dump
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "chmod 700 '$DEPLOY_DIR/backup-postgres.sh' && '$DEPLOY_DIR/backup-postgres.sh' '$DEPLOY_DIR' '$BACKUP_NAME'"

      - name: Upload deployment assets
        env:
          COMPOSE_FILE: ${{ matrix.target.compose_file }}
        run: |
          bash deploy/retry.sh 'deployment asset upload' \
            scp -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 "$COMPOSE_FILE" \
              "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/docker-compose.yml"
          bash deploy/retry.sh 'deployment asset upload' \
            scp -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 deploy/deploy.sh deploy/retry.sh \
              "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"

      - name: Deploy immutable image
        id: deploy
        env:
          IMAGE_REFERENCE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: |
          umask 077
          [[ "$IMAGE_REFERENCE" =~ ^ghcr.io/[a-zA-Z0-9_./-]+@sha256:[a-f0-9]{64}$ ]] || exit 1
          set +e
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "chmod 700 '$DEPLOY_DIR/deploy.sh' '$DEPLOY_DIR/retry.sh' && '$DEPLOY_DIR/deploy.sh' '$DEPLOY_ENVIRONMENT' '$IMAGE_REFERENCE' '$HEALTH_URL'" \
            > "$RUNNER_TEMP/deploy-output" 2>&1
          deploy_status=$?
          set -e
          rollback=$(sed -nE 's/^DEPLOY_ROLLBACK_RESULT=(not_attempted|succeeded|failed)$/\1/p' "$RUNNER_TEMP/deploy-output" | tail -n 1)
          printf 'rollback=%s\n' "${rollback:-unavailable}" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/deploy-output"
          if (( deploy_status != 0 )); then
            echo '::error::Remote deployment failed; inspect private server diagnostics.'
          fi
          exit "$deploy_status"

      - name: Verify repeated development startup
        if: inputs.verify_repeated_startup && matrix.target.id == 'development'
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            sh -s -- "$DEPLOY_DIR" "$HEALTH_URL" <<'REMOTE'
          set -eu
          deploy_dir=$1
          health_url=$2
          container_name=molii-development

          docker restart "$container_name" >/dev/null
          attempt=1
          while [ "$attempt" -le 36 ]; do
            state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_name" 2>/dev/null || true)
            if [ "$state" = healthy ]; then
              break
            fi
            if [ "$state" = exited ] || [ "$state" = dead ]; then
              echo 'Repeated startup failed; inspect server diagnostics privately.' >&2
              exit 1
            fi
            sleep 5
            attempt=$((attempt + 1))
          done

          test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_name")" = healthy
          curl --silent --show-error --fail --max-time 15 "$health_url" | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'
          printf 'Repeated startup is healthy; deployment remains at %s\n' "$deploy_dir"
          REMOTE

      - name: Record target result
        if: ${{ always() }}
        env:
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_RESULT: ${{ job.status }}
          ROLLBACK_RESULT: ${{ steps.deploy.outputs.rollback }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(f"deploy-result-{os.environ['TARGET_ID']}.json", "w", encoding="utf-8") as result_file:
              json.dump(
                  {
                      "id": os.environ["TARGET_ID"],
                      "domain": os.environ.get("SITE_DOMAIN", ""),
                      "result": os.environ["TARGET_RESULT"],
                      "source_sha": os.environ["SOURCE_SHA"],
                      "health_url": os.environ.get("HEALTH_URL", ""),
                      "rollback": os.environ.get("ROLLBACK_RESULT") or "unavailable",
                  },
                  result_file,
              )
          PY

      - name: Upload target result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-result-${{ matrix.target.id }}-${{ github.sha }}
          path: deploy-result-${{ matrix.target.id }}.json
          if-no-files-found: error
          retention-days: 7

      - name: Notify Telegram
        if: ${{ always() }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_RESULT: ${{ job.status }}
          TARGET_ENVIRONMENT: ${{ matrix.target.id }}
          ROLLBACK_RESULT: ${{ steps.deploy.outputs.rollback }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo 'Telegram secrets are not configured; skipping notification.'
            exit 0
          fi

          case "$DEPLOY_RESULT" in
            success) icon='✅'; status='成功' ;;
            cancelled) icon='⚪'; status='取消' ;;
            *) icon='❌'; status='失败' ;;
          esac

          message="$icon 应用部署$status
          站点: ${TARGET_ENVIRONMENT} (${SITE_DOMAIN})
          分支: $GITHUB_REF_NAME
          提交: $SOURCE_SHA
          健康检查: $HEALTH_URL
          回滚: ${ROLLBACK_RESULT:-unavailable}
          操作者: $GITHUB_ACTOR
          详情: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          curl --silent --fail --output /dev/null --max-time 20 \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message"

  summary:
    name: Summarize application releases
    if: ${{ always() }}
    needs:
      - prepare
      - verify
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download target results
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deploy-result-*-${{ github.sha }}
          path: deployment-results
          merge-multiple: true

      - name: Write release summary
        env:
          EXPECTED_TARGETS: ${{ needs.prepare.outputs.targets }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os

          expected_ids = {item["id"] for item in json.loads(os.environ.get("EXPECTED_TARGETS") or "[]")}
          expected = len(expected_ids)
          records = []
          for path in glob.glob("deployment-results/*.json"):
              with open(path, encoding="utf-8") as result_file:
                  record = json.load(result_file)
                  if record.get("id") in expected_ids:
                      records.append(record)

          results = [record.get("result", "failure") for record in records]
          if expected and {record["id"] for record in records} == expected_ids and len(records) == expected and all(result == "success" for result in results):
              overall = "success"
          elif any(result == "success" for result in results):
              overall = "partial_success"
          elif any(result == "cancelled" for result in results):
              overall = "cancelled"
          else:
              overall = "failure"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Application deployment summary\n\n")
              summary.write(f"- Overall: `{overall}`\n")
              summary.write(f"- Source: `{os.environ['SOURCE_SHA']}`\n")
              summary.write(f"- Verification: `{os.environ['VERIFY_RESULT']}`\n")
              summary.write(f"- Result records: `{len(records)}/{expected}`\n")
              for record in sorted(records, key=lambda item: item.get("id", "")):
                  summary.write(
                      f"- {record.get('id', 'unknown')} ({record.get('domain', '')}): "
                      f"`{record.get('result', 'failure')}`\n"
                  )
          PY
