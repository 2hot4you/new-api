name: Build and deploy Molii

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      deploy_dir: ${{ steps.target.outputs.deploy_dir }}
      health_url: ${{ steps.target.outputs.health_url }}
      image_tag: ${{ steps.target.outputs.image_tag }}
    steps:
      - name: Map branch to environment
        id: target
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            main)
              echo 'environment=production' >> "$GITHUB_OUTPUT"
              echo 'deploy_dir=/opt/molii/production' >> "$GITHUB_OUTPUT"
              echo 'health_url=https://molii.co/api/status' >> "$GITHUB_OUTPUT"
              echo 'image_tag=production' >> "$GITHUB_OUTPUT"
              ;;
            develop)
              echo 'environment=development' >> "$GITHUB_OUTPUT"
              echo 'deploy_dir=/opt/molii/development' >> "$GITHUB_OUTPUT"
              echo 'health_url=https://dev.molii.co/api/status' >> "$GITHUB_OUTPUT"
              echo 'image_tag=development' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported deployment branch: $BRANCH_NAME"
              exit 1
              ;;
          esac

  verify:
    name: Verify backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOWORK: 'off'
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Check frontend types
        working-directory: web
        run: bun run typecheck

      - name: Build frontend for backend embedding
        working-directory: web
        run: bun run build

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Test root and relaykit modules
        run: make test

      - name: Test deployment contracts
        run: bash deploy/tests/deploy_test.sh

  build:
    name: Build and publish image
    needs:
      - prepare
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Write image version
        env:
          IMAGE_VERSION: ${{ needs.prepare.outputs.image_tag }}-${{ github.sha }}
        run: printf '%s\n' "$IMAGE_VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push amd64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:${{ needs.prepare.outputs.image_tag }}
            ${{ env.REGISTRY_IMAGE }}:${{ needs.prepare.outputs.image_tag }}-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ needs.prepare.outputs.image_tag }}-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ needs.prepare.outputs.image_tag }}
          cache-to: type=gha,mode=max,scope=${{ needs.prepare.outputs.image_tag }}
          provenance: mode=max
          sbom: true

  deploy:
    name: Deploy ${{ needs.prepare.outputs.environment }}
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ needs.prepare.outputs.health_url }}
    env:
      DEPLOY_DIR: ${{ needs.prepare.outputs.deploy_dir }}
      DEPLOY_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
      HEALTH_URL: ${{ needs.prepare.outputs.health_url }}
      IMAGE_REFERENCE: ghcr.io/${{ github.repository }}@${{ needs.build.outputs.digest }}
      SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ github.token }}
      GHCR_USERNAME: ${{ github.actor }}
    steps:
      - name: Check out deployment assets
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure SSH
        run: |
          for value_name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!value_name}" ]; then
              echo "::error::Required secret is empty: $value_name"
              exit 1
            fi
          done
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Authenticate server to GHCR
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

      - name: Upload deployment assets
        run: |
          scp -P "$SSH_PORT" deploy/docker-compose.cicd.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/docker-compose.yml"
          scp -P "$SSH_PORT" deploy/deploy.sh \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/deploy.sh"

      - name: Deploy immutable image
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "chmod 700 '$DEPLOY_DIR/deploy.sh' && '$DEPLOY_DIR/deploy.sh' '$DEPLOY_ENVIRONMENT' '$IMAGE_REFERENCE' '$HEALTH_URL'"

  notify:
    name: Notify Telegram
    if: ${{ always() }}
    needs:
      - prepare
      - verify
      - build
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      TARGET_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
    steps:
      - name: Send deployment result
        continue-on-error: true
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo 'Telegram secrets are not configured; skipping notification.'
            exit 0
          fi

          case "$DEPLOY_RESULT" in
            success) icon='✅'; status='成功' ;;
            cancelled) icon='⚪'; status='取消' ;;
            *) icon='❌'; status='失败' ;;
          esac

          message="$icon Molii 部署$status
          环境: ${TARGET_ENVIRONMENT:-unknown}
          分支: $GITHUB_REF_NAME
          提交: ${GITHUB_SHA:0:12}
          操作者: $GITHUB_ACTOR
          详情: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          curl --silent --show-error --fail \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=$message"
